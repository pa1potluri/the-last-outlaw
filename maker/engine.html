// stay blocked, without treating a narrow desktop window as a mobile device.

   matchMedia('(pointer: coarse)').matches&&Math.min(screen.width,screen.height)<=1024){

 // The remaining game markup/scripts are parsed inside an inert template.
 // No game code, sprites, level data or audio are loaded on these devices.
}

     const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;

   }finally{decoder.close()}

const gunOf=e=>e.weapon||(e.boss?current().boss.weapon:null)||'revolver';
function ownedAt(i){const g=['revolver'];for(let j=0;j<i;j++){const L=GAME.levels[j];for(const s of (L.spawns||[]))if(s.type=='tough'&&s.weapon&&!g.includes(s.weapon))g.push(s.weapon);
  if(L.boss?.weapon&&!g.includes(L.boss.weapon))g.push(L.boss.weapon)}return g}
const K={};let lv=0,st='card',tc=0,cam=0,len=5200,bounty=0,levelBounty=0,P,E=[],B=[],FX=[],PK=[],time=0,say=null,shake=0,redT=0,
  muted=params.has('preview')||params.has('mute');
const hash=k=>{const x=Math.sin(k*127.1+lv*311.7)*43758.5453;return x-Math.floor(x)};
const hexA=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),rgb=a=>'rgb('+a.map(Math.round)+')';
function skyAt(){const f=clamp(Number(current().time??0),0,4),a=Math.floor(f),b=Math.min(4,a+1),t=f-a;return[0,1].map(k=>rgb(mix(hexA(SKY[a][k]),hexA(SKY[b][k]),t)))}
const isBoss=()=>!!current().boss;
// cover = crouches behind a crate and pops up to shoot; stand = shoots in the open
function enemy(x,l,boss,k){const cover=!boss&&k%3==1,pool=cover?['outlaw0','outlaw1','outlaw2']:GAME.enemies,v=Math.floor(hash(x+k*7)*pool.length);

function start(i,keep){
  const previousLevel=lv;startId++;TIMERS=[];clearInput();lv=clamp(i,0,GAME.levels.length-1);if(previousLevel!==lv)for(const key of Object.keys(BLUR))delete BLUR[key];len=+current().length||5200;LANE=current().lanes||GAME.world?.lanes||[815,860,905];LSC=current().laneScale||GAME.world?.laneScale||[.9,.95,1];cam=0;strip=null;stripLv=-1;levelBounty=0;redT=0;shake=0;WX=[];nextBolt=3;flashT=0;
  [lv,lv+1].forEach(j=>{if(GAME.levels[j]){[...LAYERS.map(x=>x[0]),'gate'].forEach(k=>slot(j,k).forEach(img));(GAME.levels[j].background.panels||[]).forEach(img)}});   // preload this + next level
  P={x:160,l:1,z:0,vz:0,hp:keep?Math.min(GAME.player.hp,P.hp+40):GAME.player.hp,face:1,cd:0,inv:0,shot:0,run:0,kx:0,land:0};
  E=[];B=[];FX=[];PK=[];DY=[];GP=[];banner=null;GUNS=ownedAt(lv);if(!keep){AMMO={...levelAmmo};gun=levelGun}for(const g of GUNS)if(AMMO_MAX[g]&&AMMO[g]==null)AMMO[g]=Math.round(AMMO_MAX[g]*.6);if(!GUNS.includes(gun)||WEAPON[gun].throw)gun=GUNS.filter(g=>!WEAPON[g].throw).pop();BR=(current().barrels||[]).map(b=>({x:+b.x,l:clamp(+b.lane||0,0,2),hp:2}));tipIdx=0;tip=null;cpHit=false;VG=(current().villagers||[]).map(v=>({x:+v.x,l:clamp(+v.lane||0,0,2),spr:spriteName(v.sprite||'dave'),free:0,line:v.line||'Thank you, mister!'}));PK=(current().hearts||[]).map(h=>({x:+h.x,l:clamp(+h.lane||0,0,2),t:-999}));const n=Math.max(0,Number(current().enemies)||0),sp=current().spawns;

// Earliest intersection of a moving projectile and an axis-aligned body.
function segmentHit(x0,z0,x1,z1,left,right,bottom,top){let lo=0,hi=1;

    const a=(min-p)/d,b=(max-p)/d;lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));if(lo>hi)return null;
  }return lo;
}

// Preload lossless assets before accepting input. Keep only the title, sprite,
// and opening-level images resident; later scenery remains in the HTTP cache.
const SOUND_BYTES=Object.create(null);
function assetReferences(value, refs=new Set()){
 if(typeof value==='string'&&/\.(webp|flac)$/i.test(value))refs.add(value);
 else if(value&&typeof value==='object')for(const child of Object.values(value))assetReferences(child,refs);
 return refs;
}
function loadingProgress(done,total){
 const percent=Math.floor(done/total*100),label='Loading… '+percent+'%';
 document.getElementById('loadingText').textContent=label;

async function preloadImage(file){await loadImage(file);}
async function preloadGame(data){
 const references=assetReferences(data,assetReferences(SPRS));
 references.add('art/sprites/war_wagon_v3.webp');
 const files=[...references],retain=assetReferences(data.levels[Number(params.get('level'))||0]||data.levels[0],assetReferences(SPRS));
 retain.add(data.titleImage);retain.add(data.worldMap);
 let done=0,next=0;loadingProgress(done,files.length);
 // Show the title art before the larger scenery queue starts.
 if(data.titleImage)await preloadImage(data.titleImage);
 async function worker(){
  while(next<files.length){const file=files[next++];
   if(file.endsWith('.flac')){
    const response=await fetch(asset(file));if(!response.ok)throw Error('Could not load '+file);
    SOUND_BYTES[file]=await response.arrayBuffer();
   }else{
    await preloadImage(file);
    if(!retain.has(file)){delete IMG[file];delete IMG_PROMISE[file]}
   }
   loadingProgress(++done,files.length);
  }

}
async function loadGame(){

  const response=await fetch(ROOT+'maker/games/'+safeName+'/game.json',{cache:'no-store'});
  if(!response.ok)throw Error('Game not found');const data=await response.json();

  document.getElementById('loadingText').textContent='Loading failed';

 }
}
